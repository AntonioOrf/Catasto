name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lint -w catasto-frontend

      - name: Type-check backend
        working-directory: backend-catasto
        run: npx tsc --noEmit

      - name: Type-check frontend
        working-directory: frontend-catasto
        run: npx tsc --noEmit

      - run: npm test
