name: Docker images

# Pubblica le immagini su Docker Hub a ogni merge su main, solo se la CI è
# passata: un'immagine rotta non deve mai diventare "latest".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          # Il commit che la CI ha validato, non l'ultimo di main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Il contesto è la radice del monorepo: il Dockerfile copia anche
      # packages/shared.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}-catasto/Dockerfile
          push: true
          tags: |
            ipavon/catasto1427-${{ matrix.app }}:latest
            ipavon/catasto1427-${{ matrix.app }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
