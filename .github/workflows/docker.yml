name: Docker images

# Pubblica le immagini su Docker Hub a ogni merge su main, solo se la CI è
# passata: un'immagine rotta non deve mai diventare "latest". Avviato a mano
# da un ramo diverso da main pubblica solo il tag :sha, per provare
# un'immagine senza toccare quella in produzione.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          # Il commit che la CI ha validato, non l'ultimo di main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # :latest solo per il main: da workflow_run (che parte solo dal main) o da
      # un avvio manuale sul main.
      - name: Tags
        id: tags
        env:
          IMAGE: ipavon/catasto1427-${{ matrix.app }}
          SHORT: ${{ steps.sha.outputs.short }}
          LATEST: ${{ github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' }}
        run: |
          {
            echo "list<<EOF"
            echo "$IMAGE:$SHORT"
            if [ "$LATEST" = "true" ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Il contesto è la radice del monorepo: il Dockerfile copia anche
      # packages/shared.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}-catasto/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
