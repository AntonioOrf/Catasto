# Copiare in secret.yaml (ignorato da git) e sostituire i valori, tutti
# fittizi. In alternativa crearlo da riga di comando:
#   kubectl create secret generic catasto-secrets \
#     --from-literal=DB_USER=... --from-literal=DB_PASSWORD=... ...
apiVersion: v1
kind: Secret
metadata:
  name: catasto-secrets
type: Opaque
stringData:
  DB_USER: catasto_user
  DB_PASSWORD: cambiami
  SEGNALAZIONI_SALT: stringa_casuale_lunga
  ADMIN_TOKEN: token_moderazione_segreto
  MODERAZIONE_SECRET: ""
