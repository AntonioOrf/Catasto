server {
    listen 80;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Intestazioni di sicurezza per la SPA. Le immagini dei manoscritti arrivano
    # dal server IIIF dell'Archivio (host indicato nel manifest), quindi img-src
    # ammette https:. Gli add_header valgono solo se la location non ne dichiara
    # di propri: non aggiungerne nelle location senza ripetere questi.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr e non $proxy_add_x_forwarded_for: un X-Forwarded-For
        # inviato dal client non deve arrivare al backend, che con
        # TRUST_PROXY=1 legge l'ultimo valore della catena come IP reale.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
