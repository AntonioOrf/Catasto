server {
    listen 80;
    server_tokens off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    root /usr/share/nginx/html;
    index index.html;

    # Il bundle JS e le risposte JSON dell'API si comprimono di 3-4 volte.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # I body accettati dall'API (AST di ricerca, segnalazioni) stanno nei KB.
    client_max_body_size 128k;

    include /etc/nginx/snippets/security-headers.conf;

    # File con hash nel nome: il contenuto non cambia mai, cache di un anno.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html va sempre riconvalidato, altrimenti dopo un deploy il browser
    # continua a chiedere bundle che non esistono più.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr e non $proxy_add_x_forwarded_for: un X-Forwarded-For
        # inviato dal client non deve arrivare al backend, che con
        # TRUST_PROXY=1 legge l'ultimo valore della catena come IP reale.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
