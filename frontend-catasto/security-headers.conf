# Intestazioni di sicurezza della SPA, incluse in ogni location che dichiara
# add_header propri (nginx eredita gli add_header del server solo se la
# location non ne ha). Le immagini dei manoscritti arrivano dal server IIIF
# dell'Archivio (host indicato nel manifest), quindi img-src ammette https:.
# Il browser parla solo con il proprio backend: connect-src resta 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
