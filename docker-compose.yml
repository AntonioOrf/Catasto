services:
  db:
    image: mysql:8.0
    container_name: catasto-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Solo loopback: Docker scavalca il firewall dell'host (ufw/iptables), quindi
    # "3306:3306" esporrebbe MySQL su internet.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./init/Catasto.sql:/docker-entrypoint-initdb.d/Catasto.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 10s
      retries: 20
      interval: 10s

  # Immagine unica: sito e API dallo stesso processo Node (niente nginx).
  app:
    image: ipavon/catasto1427:latest
    container_name: catasto-app
    restart: always
    ports:
      - "1427:3005"
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - DB_PORT=3306
      - DB_SSL=false
      - PORT=3005
      # Segnalazioni utenti: vedi .env.prod.example
      - SEGNALAZIONI_SALT=${SEGNALAZIONI_SALT}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - FORMSUBMIT_EMAIL=${FORMSUBMIT_EMAIL:-}
      - FORMSUBMIT_ORIGIN=${FORMSUBMIT_ORIGIN:-}
      - MODERAZIONE_SECRET=${MODERAZIONE_SECRET:-}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-}
      # Vuota = la porta 1427 e' esposta direttamente e l'IP del client e'
      # quello della connessione. Impostala (di solito 1) SOLO se davanti c'e'
      # un reverse proxy (Caddy, Traefik, nginx dell'host, Cloudflare...) e la
      # porta non e' raggiungibile da fuori senza passare da li': altrimenti
      # un client potrebbe falsificare X-Forwarded-For e aggirare i limiti.
      - TRUST_PROXY=${TRUST_PROXY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - FILTERS_CACHE_TTL=${FILTERS_CACHE_TTL:-}
      - EXPORT_MAX_ROWS=${EXPORT_MAX_ROWS:-}
      # Vuota con un solo container. "mysql" se piu' istanze servono il
      # portale dietro un bilanciatore: vedi docs/portabilita.md.
      - SHARED_STATE=${SHARED_STATE:-}
    depends_on:
      db:
        condition: service_healthy
